name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-source-and-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.17"

      - name: Validate source and privacy boundaries
        run: |
          ./verify_linux.sh --skill-root "$PWD/.agents/skills/bilibili-video-learning" --skip-runtime
          uv run --isolated --with pyyaml python ./tools/validate_repository.py

      - name: Confirm the committed dependency lock
        run: uv lock --check --project .agents/skills/bilibili-video-learning

      - name: Run portable lifecycle probes
        run: |
          python .agents/skills/bilibili-video-learning/tests/runtime.py
          python .agents/skills/bilibili-video-learning/tests/behavior.py

      - name: Build a lightweight test environment
        run: |
          skill_root="$PWD/.agents/skills/bilibili-video-learning"
          uv venv .ci-venv --python 3.12
          uv pip install --python .ci-venv/bin/python pytest click prompt-toolkit requests setuptools pyyaml imageio-ffmpeg opencc-python-reimplemented>=0.1.7  # 让需要真实媒体的用例（无音轨检测/音频抽取）在 CI 里也真的跑起来
          uv pip install --python .ci-venv/bin/python --no-deps -e "$skill_root/agent-harness"

      - name: Run offline tests without ASR model downloads
        run: |
          skill_root="$PWD/.agents/skills/bilibili-video-learning"
          export BILIBILI_VIDEO_LEARNING_ROOT="$skill_root"
          export BILIBILI_VIDEO_LEARNING_PYTHON="$PWD/.ci-venv/bin/python"
          export CLI_ANYTHING_FORCE_INSTALLED=1
          export VIDEO_LEARNING_SKIP_INSTALLED_RUNTIME_TESTS=1
          export PATH="$PWD/.ci-venv/bin:$PATH"
          .ci-venv/bin/python -m pytest -q "$skill_root/agent-harness/cli_anything/video_learning/tests"
      - name: Cross-gold benchmark gate (real golds, committed hypotheses)
        run: |
          skill_root="$PWD/.agents/skills/bilibili-video-learning"   # 本步骤自包含：不依赖别处定义的变量
          .ci-venv/bin/python "$skill_root/scripts/run_benchmark.py" \
            --case "bili1-large=$skill_root/agent-harness/cli_anything/video_learning/tests/fixtures/bili1_large.json:bilibili-BV1ntah6TEe9.json" \
            --case "bili2-large=$skill_root/agent-harness/cli_anything/video_learning/tests/fixtures/bili2_large.json:bilibili-BV1Kyas6wEuz.json" \
            --max-cer 0.05

      - name: Baseline non-regression (records every tier, including small)
        run: |
          skill_root="$PWD/.agents/skills/bilibili-video-learning"
          fixtures="$skill_root/agent-harness/cli_anything/video_learning/tests/fixtures"
          .ci-venv/bin/python "$skill_root/scripts/run_benchmark.py" \
            --case "bili1-large=$fixtures/bili1_large.json:bilibili-BV1ntah6TEe9.json" \
            --case "bili1-small=$fixtures/bili1_small.json:bilibili-BV1ntah6TEe9.json" \
            --case "bili2-large=$fixtures/bili2_large.json:bilibili-BV1Kyas6wEuz.json" \
            --case "bili2-small=$fixtures/bili2_small.json:bilibili-BV1Kyas6wEuz.json" \
            --baseline "$skill_root/eval/baselines.json"
      - name: Smoke-test the installed CLI entrypoint
        run: |
          skill_root="$PWD/.agents/skills/bilibili-video-learning"
          export BILIBILI_VIDEO_LEARNING_ROOT="$skill_root"
          export BILIBILI_VIDEO_LEARNING_PYTHON="$PWD/.ci-venv/bin/python"
          .ci-venv/bin/python ./tools/cli_smoke.py

  windows-source-and-offline-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.17"

      - name: Validate source and privacy boundaries
        shell: pwsh
        run: |
          $skillRoot = Join-Path $PWD ".agents\skills\bilibili-video-learning"
          .\verify.ps1 -SkillRoot $skillRoot -SkipRuntime
          uv run --isolated --with pyyaml python .\tools\validate_repository.py

      - name: Confirm the committed dependency lock
        shell: pwsh
        run: |
          $skillRoot = Join-Path $PWD ".agents\skills\bilibili-video-learning"
          uv lock --check --project $skillRoot

      - name: Build a lightweight test environment
        shell: pwsh
        run: |
          $skillRoot = Join-Path $PWD ".agents\skills\bilibili-video-learning"
          uv venv .ci-venv --python 3.12
          uv pip install --python .\.ci-venv\Scripts\python.exe pytest click prompt-toolkit requests setuptools pyyaml imageio-ffmpeg  # 同上：CI 也要能生成真实媒体 opencc-python-reimplemented>=0.1.7  # 与本地同归一模式，CER 才可比
          uv pip install --python .\.ci-venv\Scripts\python.exe --no-deps -e "$skillRoot\agent-harness"

      - name: Run offline tests without the multi-GB GPU runtime
        shell: pwsh
        run: |
          $skillRoot = Join-Path $PWD ".agents\skills\bilibili-video-learning"
          $env:BILIBILI_VIDEO_LEARNING_ROOT = $skillRoot
          $env:BILIBILI_VIDEO_LEARNING_PYTHON = (Resolve-Path ".\.ci-venv\Scripts\python.exe").Path
          $env:CLI_ANYTHING_FORCE_INSTALLED = "1"
          $env:VIDEO_LEARNING_SKIP_INSTALLED_RUNTIME_TESTS = "1"
          $env:PATH = "$(Resolve-Path '.\.ci-venv\Scripts');$env:PATH"
          .\.ci-venv\Scripts\python.exe -m pytest -q "$skillRoot\agent-harness\cli_anything\video_learning\tests"
      - name: Cross-gold benchmark gate (real golds, committed hypotheses)
        run: |
          $skillRoot = Join-Path $PWD ".agents/skills/bilibili-video-learning"   # 本步骤自包含
          .\.ci-venv\Scripts\python.exe "$skillRoot\scripts\run_benchmark.py" `
            --case "bili1-large=$skillRoot\agent-harness\cli_anything\video_learning\tests\fixtures\bili1_large.json:bilibili-BV1ntah6TEe9.json" `
            --case "bili2-large=$skillRoot\agent-harness\cli_anything\video_learning\tests\fixtures\bili2_large.json:bilibili-BV1Kyas6wEuz.json" `
            --max-cer 0.05

      - name: Baseline non-regression (records every tier, including small)
        run: |
          $skillRoot = Join-Path $PWD ".agents/skills/bilibili-video-learning"
          $fixtures = Join-Path $skillRoot "agent-harness\cli_anything\video_learning\tests\fixtures"
          .\.ci-venv\Scripts\python.exe "$skillRoot\scripts\run_benchmark.py" `
            --case "bili1-large=$fixtures\bili1_large.json:bilibili-BV1ntah6TEe9.json" `
            --case "bili1-small=$fixtures\bili1_small.json:bilibili-BV1ntah6TEe9.json" `
            --case "bili2-large=$fixtures\bili2_large.json:bilibili-BV1Kyas6wEuz.json" `
            --case "bili2-small=$fixtures\bili2_small.json:bilibili-BV1Kyas6wEuz.json" `
            --baseline "$skillRoot\eval\baselines.json"
      - name: Run portable lifecycle probes
        shell: pwsh
        run: |
          $skillRoot = Join-Path $PWD ".agents\skills\bilibili-video-learning"
          python "$skillRoot\tests\runtime.py"
          python "$skillRoot\tests\behavior.py"

      - name: Smoke-test the installed CLI entrypoint
        shell: pwsh
        run: |
          $skillRoot = Join-Path $PWD ".agents\skills\bilibili-video-learning"
          $env:BILIBILI_VIDEO_LEARNING_ROOT = $skillRoot
          $env:BILIBILI_VIDEO_LEARNING_PYTHON = (Resolve-Path ".\.ci-venv\Scripts\python.exe").Path
          .\.ci-venv\Scripts\python.exe .\tools\cli_smoke.py
