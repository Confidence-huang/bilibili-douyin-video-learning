# Claude Code Skill interface.
#
# Claude Code reads the Agent Skill from `SKILL.md`; this file only declares the
# host-facing presentation so the invocation name, colour, and starter prompt
# cannot drift away from the OpenAI manifest next to it.
interface:
  display_name: "Bilibili & Douyin Video Learning"
  short_description: "Turn Bilibili and Douyin videos into Chinese study notes"
  brand_color: "#00a1d6"
  # Claude Code addresses Skills by name, so the invocation token has no `$` prefix here.
  invocation_name: "bilibili-video-learning"
  default_prompt: "Use the bilibili-video-learning Skill to turn this Bilibili or Douyin video into structured study notes."
  # Claude Code surfaces this Skill for these phrasings; keep it close to SKILL.md's description.
  triggers:
    - "总结这个视频"
    - "帮我学习这个 B站/抖音 视频"
    - "把这个视频整理成笔记"
