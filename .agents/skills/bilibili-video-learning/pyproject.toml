[project]
name = "bilibili-video-learning"
version = "1.30.0"
requires-python = ">=3.12"

# Version floors are not arbitrary. Each `>=` below closes a known advisory or a
# breaking upstream change; see docs/DECISIONS.md D13 for the reasoning and the
# re-evaluation triggers. Raising a floor without recording why makes the next
# reader unable to tell a security bump from a cosmetic one.
dependencies = [
    # 8.1.7 carries the `click.Choice` and context-object behaviour this CLI relies on.
    "click>=8.1.7",
    # 0.6.0 is the first release whose bundled FFmpeg supports the `-f` probes used by
    # scripts/media_tools.py; older builds returned a binary the Douyin ratio probe rejected.
    "imageio-ffmpeg>=0.6.0",
    # 3.0.48 fixes the prompt_toolkit resize/redraw crash on Windows Terminal with CJK input.
    "prompt-toolkit>=3.0.48",
    # 2.32.4 removes the CVE-2024-47081 .netrc credential-leak behaviour (GHSA-9hjg-9r4m-mvj7).
    "requests>=2.32.4",
    # 75.0.0 drops the vendored `pkg_resources` path that breaks on Python 3.12+.
    "setuptools>=75.0.0",
    # Kept for the legacy fallback only; D6 explains why it is not the primary path.
    "you-get>=0.4.1743",
    # 2026.7.4 is the first release that accepts `--impersonate chrome-110:windows-10`
    # against Douyin. The extras are named explicitly so the dependency surface stays
    # visible here instead of being implied by a flavour flag.
    "yt-dlp[curl-cffi,default]>=2026.7.4",
]

[project.optional-dependencies]
# 标点恢复模型（可选）：装上并显式开启后才会用到，缺失时自动退回规则法（D44）
punctuation = ["deepmultilingualpunctuation>=1.0.1"]
# CPU-only ASR. Installs the CTranslate2 backend without any NVIDIA runtime wheels,
# so a Linux or GPU-less Windows user is never asked to download multi-GB CUDA packages.
asr = [
    "faster-whisper>=1.2.1",
]
# Optional TLS-fingerprint impersonation for sites that reject the default client.
# yt-dlp degrades to its standard transport when this is absent, so it is not a
# hard requirement for the public metadata/subtitle paths.
impersonate = [
    "curl-cffi>=0.15.0",
]
# CUDA runtime libraries for the prebuilt CTranslate2 wheel. The WSL driver ships
# libcuda.so but NOT cuBLAS/cuDNN, so on WSL (and on any host whose CUDA runtime is
# incomplete) device enumeration succeeds while the first encode() fails with
# "Library libcublas.so.12 is not found". scripts/cuda_runtime.py preloads these
# wheels, so the GPU becomes usable without LD_LIBRARY_PATH and without touching the
# driver. Kept optional: installing them downloads ~700MB and CPU-only users need none
# of it. See docs/DECISIONS.md D23.
gpu-cuda12 = [
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.0",
    "nvidia-cuda-runtime-cu12>=12.4",
]
# Traditional-to-Simplified conversion for --simplify. Pure Python, so it stays out of
# the main dependency set; without it --simplify auto degrades to "leave text as-is"
# and records why. See D22.
zh-normalize = [
    "opencc-python-reimplemented>=0.1.7",
]
# OCR engine for burned-in captions (scripts/hard_subtitle.py). onnxruntime-based and
# ~15MB of models, so it is optional; the module raises an actionable error when the
# extra is missing instead of failing obscurely.
hard-subtitle = [
    "rapidocr-onnxruntime>=1.3",
]
# Windows compatibility profile: the PyTorch-based ASR path, used only after
# faster-whisper has actually failed (D8). Separate because it pulls torch + CUDA wheels.
cuda-compat = [
    "openai-whisper==20250625",
    "torch==2.11.0+cu128",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
