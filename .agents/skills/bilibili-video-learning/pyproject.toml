[project]
name = "bilibili-video-learning"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "imageio-ffmpeg>=0.6.0",
    "prompt-toolkit>=3.0.48",
    "requests>=2.32.4",
    "setuptools>=75.0.0",
    "you-get>=0.4.1743",
    "yt-dlp[curl-cffi,default]>=2026.7.4",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.2.1",
]
cuda-compat = [
    "openai-whisper==20250625",
    "torch==2.11.0+cu128",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
